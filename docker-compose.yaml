services:
  ph-db:
    image: postgres:16-alpine
    container_name: ph-db
    restart: always
    environment:
      POSTGRES_USER: neondb_owner
      POSTGRES_PASSWORD: npg_y4J0EdAefhYu
      POSTGRES_DB: healthcare
    ports:
      - "5432:5432"
    volumes:
      - ph-pg-data:/var/lib/postgresql/data
    networks:
      - ph-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neondb_owner -d healthcare"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  ph-server:
    container_name: ph-server
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      DATABASE_URL: postgresql://neondb_owner:npg_y4J0EdAefhYu@ph-db:5432/healthcare
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "300"
    working_dir: /app
    volumes:
      - ./server:/app
      - server-node-modules:/app/node_modules
      - server-logs:/app/logs
    depends_on:
      ph-db:
        condition: service_healthy
    networks:
      - ph-net
    command: sh -lc "CI=true pnpm install && pnpm prisma generate && pnpm prisma migrate deploy && pnpm dev"

  ph-client:
    container_name: ph-client
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      ph-server:
        condition: service_started
    ports:
      - "3000:3000"
    env_file:
      - ./client/.env
    environment:
      CHOKIDAR_USEPOLLING: "1"
      CHOKIDAR_INTERVAL: "300"
      WEBPACK_POLLING: "true"
    working_dir: /app
    volumes:
      - ./client:/app
      - client-node-modules:/app/node_modules
    networks:
      - ph-net
    command: sh -lc "CI=true pnpm install && pnpm dev"

networks:
  ph-net:
    driver: bridge

volumes:
  ph-pg-data:
  server-node-modules:
  server-logs:
  client-node-modules: